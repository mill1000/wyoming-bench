[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-tts-bench"
version = "0.1.0"
description = "Benchmark Wyoming-protocol TTS servers (non-streaming and streaming)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "wyoming>=1.10.2",
]

[project.scripts]
wyoming-tts-bench = "wyoming_tts_bench.cli:main"

[tool.setuptools]
packages = ["wyoming_tts_bench"]
